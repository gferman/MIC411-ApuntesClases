name: Compilar LaTeX y Publicar en GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código fuente
        uses: actions/checkout@v4

      - name: Instalar Dependencias (TeX, Biber, Pandoc, Pygments)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-full \
            biber \
            pandoc \
            python3-pygments

      - name: Compilar archivo PDF (con permisos para minted)
        run: |
          pdflatex -interaction=nonstopmode -shell-escape MIC411apuntes.tex
          biber MIC411apuntes || true
          pdflatex -interaction=nonstopmode -shell-escape MIC411apuntes.tex
          pdflatex -interaction=nonstopmode -shell-escape MIC411apuntes.tex

      - name: Compilar archivo HTML con Pandoc
        run: |
          pandoc MIC411apuntes.tex -s --mathjax --citeproc -o index.html --metadata title="MIC411 Dinámica Estructural Avanzada"

      - name: Organizar archivos para publicación
        run: |
          mkdir public
          mv MIC411apuntes.pdf public/apuntes.pdf
          mv index.html public/index.html
          # Copiar la carpeta de figuras para que el HTML pueda mostrarlas
