name: Compilar Sitio Web Multipartes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-website:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código fuente
        uses: actions/checkout@v4

      - name: Instalar TeX Live Completo y utilidades
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full biber python3-pygments

      - name: Compilar HTML con make4ht (Páginas divididas)
        run: |
          # El parámetro '2' divide el documento en páginas web separadas por \chapter
          # El parámetro 'mathjax' inyecta el código necesario para renderizar matemática web
          make4ht -u -d public MIC411apuntes.tex "mathjax,html,2"
          
      - name: Procesar Bibliografía
        run: |
          biber MIC411apuntes || true
          
      - name: Recompilar para generar enlaces cruzados
        run: |
          make4ht -u -d public MIC411apuntes.tex "mathjax,html,2"

      - name: Configurar página de inicio y organizar figuras
        run: |
          # make4ht genera el archivo principal con el nombre de tu documento.
          # Creamos un index.html que redirija automáticamente a ese archivo para que GitHub lo muestre.
          echo '<meta http-equiv="refresh" content="0; URL=MIC411apuntes.html" />' > public/index.html
          # Aseguramos que los gráficos pasen a la carpeta pública
          cp -r Figuras public/Figuras || true

      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
