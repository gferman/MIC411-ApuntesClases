name: Compilar HTML con Pandoc

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-html:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código fuente
        uses: actions/checkout@v4

      - name: Instalar Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Compilar archivo HTML con Pandoc
        run: |
          pandoc MIC411apuntes.tex -s --mathjax --citeproc -o index.html --metadata title="MIC411 Dinámica Estructural Avanzada"

      - name: Organizar archivos para publicación
        run: |
          mkdir public
          mv index.html public/index.html
          cp -r Figuras public/Figuras || true

      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
