name: Compilar LaTeX y Publicar en GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código fuente
        uses: actions/checkout@v4

      - name: Instalar TeX Live, Biber y Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-spanish \
            texlive-bibtex-extra \
            biber \
            pandoc

      - name: Compilar archivo PDF
        run: |
          pdflatex -interaction=nonstopmode MIC411apuntes.tex
          biber MIC411apuntes || true
          pdflatex -interaction=nonstopmode MIC411apuntes.tex
          pdflatex -interaction=nonstopmode MIC411apuntes.tex

      - name: Compilar archivo HTML con Pandoc
        run: |
          pandoc MIC411apuntes.tex -s --mathjax --citeproc -o index.html --metadata title="Apuntes de Clase"

      - name: Organizar archivos para publicación
        run: |
          mkdir public
          mv MIC411apuntes.pdf public/apuntes.pdf
          mv index.html public/index.html

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
